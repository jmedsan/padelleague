version: "2"

run:
  timeout: 5m

linters:
  enable:
    - gocognit
    - funlen
    - nestif
    - unparam
    - revive
    - errorlint
    - bodyclose
  settings:
    gocognit:
      min-complexity: 15
    funlen:
      lines: 60
      statements: 40
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
        - name: file-length-limit
          arguments: [{max: 800, skipComments: true, skipBlankLines: true}]
        - name: context-as-argument
        - name: max-control-nesting
          arguments: [3]
        - name: argument-limit
          arguments: [4]
        - name: function-result-limit
          arguments: [4]
  exclusions:
    rules:
      - path: migrations/
        linters:
          - funlen
          - gocognit
      # Scenario and table-driven tests are linear by design; complexity
      # limits push toward indirection that hurts readability.
      - path: _test\.go$
        linters:
          - funlen
          - gocognit
      - path: _test\.go$
        text: "file-length-limit"
        linters:
          - revive
      - path: _test\.go$
        text: "argument-limit"
        linters:
          - revive

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
