{{define "content"}}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-sm">
        <div class="card-body">
            <h2 class="card-title justify-center text-2xl mb-4">Nueva contraseña</h2>
            <div id="result"></div>
            <form hx-post="/reset-password" hx-target="#result">
                <input type="hidden" name="token" value="{{.Token}}">
                <div class="form-control">
                    <label class="label" for="password">
                        <span class="label-text">Nueva contraseña</span>
                    </label>
                    <input type="password" id="password" name="password" class="input input-bordered" required minlength="8">
                </div>
                <div class="form-control mt-2">
                    <label class="label" for="passwordConfirm">
                        <span class="label-text">Confirmar contraseña</span>
                    </label>
                    <input type="password" id="passwordConfirm" name="passwordConfirm" class="input input-bordered" required minlength="8">
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary">Cambiar contraseña</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
