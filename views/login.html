{{define "content"}}
<div class="-mx-4 -mt-6 -mb-6 min-h-[80vh] flex flex-col items-center justify-center relative overflow-hidden bg-neutral" style="margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%);width:100vw">
    <div class="text-center mb-8 px-4">
        {{if .Branding.LogoURL}}<img src="{{.Branding.LogoURL}}" alt="{{.Branding.Name}}" class="mx-auto mb-4 rounded-2xl" style="height:120px;width:auto" loading="lazy">{{end}}
        <h1 class="text-4xl sm:text-5xl font-black italic uppercase tracking-tight text-neutral-content"><span class="text-primary">Liga</span> Dale Fuerte</h1>
        <p class="text-neutral-content/60 text-sm uppercase tracking-widest mt-2">A La Pelota</p>
    </div>
    <div class="card bg-base-100 shadow-2xl w-full max-w-sm rounded-2xl mx-4">
        <div class="card-body px-8 py-8">
            <h2 class="text-lg font-bold text-center">Iniciar sesión</h2>
            <div id="error" aria-live="polite"></div>
            <form hx-post="/login" hx-target="#error" class="mt-2">
                <div class="form-control">
                    <label class="label" for="email">
                        <span class="label-text text-sm font-medium">Email</span>
                    </label>
                    <input type="email" id="email" name="email" class="input input-bordered w-full" placeholder="tu@email.com" required>
                </div>
                <div class="form-control mt-3">
                    <label class="label" for="password">
                        <span class="label-text text-sm font-medium">Contraseña</span>
                    </label>
                    <input type="password" id="password" name="password" class="input input-bordered w-full" placeholder="********" required>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" hx-disabled-elt="this" class="btn btn-primary btn-lg w-full text-lg font-bold shadow-lg">Entrar</button>
                </div>
            </form>
            <div class="divider text-sm opacity-60 my-3">O</div>
            <p class="text-center text-sm">
                <a href="/register" class="link link-primary font-semibold py-2 inline-block">Crear cuenta nueva</a>
            </p>
            <p class="text-center text-sm mt-1">
                <a href="/forgot-password" class="link link-hover opacity-50">¿Olvidaste tu contraseña?</a>
            </p>
        </div>
    </div>
</div>
{{end}}
