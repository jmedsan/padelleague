{{define "content"}}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-sm rounded-2xl">
        <div class="card-body">
            <div class="text-center mb-4">
                
                <h2 class="text-2xl font-bold mt-2">Iniciar sesión</h2>
                <p class="text-sm opacity-50 mt-1">Accede a tu cuenta de PadelLeague</p>
            </div>
            <div id="error"></div>
            <form hx-post="/login" hx-target="#error">
                <div class="form-control">
                    <label class="label" for="email">
                        <span class="label-text text-xs font-medium">Email</span>
                    </label>
                    <input type="email" id="email" name="email" class="input input-bordered w-full" placeholder="tu@email.com" required>
                </div>
                <div class="form-control mt-3">
                    <label class="label" for="password">
                        <span class="label-text text-xs font-medium">Contraseña</span>
                    </label>
                    <input type="password" id="password" name="password" class="input input-bordered w-full" placeholder="********" required>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary w-full">Entrar</button>
                </div>
            </form>
            <div class="divider text-xs opacity-60 my-3">O</div>
            <p class="text-center text-sm">
                <a href="/register" class="link link-primary font-medium">Crear cuenta nueva</a>
            </p>
            <p class="text-center text-xs mt-1">
                <a href="/forgot-password" class="link link-hover opacity-50">¿Olvidaste tu contraseña?</a>
            </p>
        </div>
    </div>
</div>
{{end}}
