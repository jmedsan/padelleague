{{define "content"}}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-sm rounded-2xl">
        <div class="card-body">
            <div class="text-center mb-4">
                
                <h2 class="text-2xl font-bold mt-2">Completa tu perfil</h2>
                <p class="text-sm opacity-50 mt-1">Necesitamos tu nombre para continuar</p>
            </div>
            <div id="error"></div>
            <form hx-post="/profile/complete" hx-target="#error">
                <div class="form-control">
                    <label class="label" for="display_name">
                        <span class="label-text text-xs font-medium">Nombre</span>
                    </label>
                    <input type="text" id="display_name" name="display_name" class="input input-bordered w-full" placeholder="Tu nombre" required>
                </div>
                <div class="form-control mt-3">
                    <label class="label" for="gender">
                        <span class="label-text text-xs font-medium">Género</span>
                    </label>
                    <select id="gender" name="gender" class="select select-bordered w-full" required>
                        <option value="" disabled selected>Selecciona</option>
                        <option value="male">Hombre</option>
                        <option value="female">Mujer</option>
                    </select>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary w-full">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{{end}}
