{{define "content"}}
<div class="mb-2">
    <a href="/" class="btn btn-ghost btn-sm gap-1 opacity-70">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
        Inicio
    </a>
</div>

{{template "competitionHeader" (dict "Mode" .Mode "Comp" .Competition)}}

<div class="card bg-base-100 shadow-sm rounded-xl">
    <div class="card-body">
        <h2 class="card-title text-lg">Documentos obligatorios</h2>
        <p class="text-sm opacity-70 mb-4">Antes de acceder a la competición, debes revisar los siguientes documentos.</p>

        <div class="space-y-3">
            {{range .DocumentViews}}
            {{template "documentCard" .}}
            {{end}}
        </div>

        <form hx-post="/competition/{{.Competition.Id}}/accept-docs" class="mt-6">
            <button id="accept-btn" type="submit" class="btn btn-primary w-full" disabled>
                He leído los documentos obligatorios
            </button>
        </form>
    </div>
</div>

<script>
const need = new Set([{{range $i, $id := .MandatoryIDs}}{{if $i}},{{end}}"{{$id}}"{{end}}]);
const opened = new Set();
document.querySelectorAll('[data-mandatory-id]').forEach(function(a) {
    a.addEventListener('click', function() {
        opened.add(a.dataset.mandatoryId);
        a.closest('[data-testid="document-card"]').classList.add('ring-2', 'ring-success');
        if ([...need].every(function(id) { return opened.has(id); })) {
            document.getElementById('accept-btn').disabled = false;
        }
    });
});
</script>
{{end}}
