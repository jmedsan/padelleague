{{define "content"}}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-sm rounded-2xl">
        <div class="card-body">
            <div class="text-center mb-4">
                
                <h2 class="text-2xl font-bold mt-2">Restablecer contraseña</h2>
                <p class="text-sm opacity-50 mt-1">Te enviaremos un enlace de recuperación</p>
            </div>
            <div id="result"></div>
            <form hx-post="/forgot-password" hx-target="#result">
                <div class="form-control">
                    <label class="label" for="email">
                        <span class="label-text text-xs font-medium">Email</span>
                    </label>
                    <input type="email" id="email" name="email" class="input input-bordered w-full" placeholder="tu@email.com" required>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary w-full">Enviar enlace</button>
                </div>
            </form>
            <div class="divider text-xs opacity-60 my-3"></div>
            <p class="text-center text-sm">
                <a href="/login" class="link link-primary font-medium">Volver al inicio de sesión</a>
            </p>
        </div>
    </div>
</div>
{{end}}
