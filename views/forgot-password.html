{{define "content"}}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-sm">
        <div class="card-body">
            <h2 class="card-title justify-center text-2xl mb-4">Restablecer contraseña</h2>
            <div id="result"></div>
            <form hx-post="/forgot-password" hx-target="#result">
                <div class="form-control">
                    <label class="label" for="email">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" id="email" name="email" class="input input-bordered" required>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary">Enviar enlace</button>
                </div>
            </form>
            <p class="text-center mt-4 text-sm">
                <a href="/login" class="link link-primary">Volver al inicio de sesión</a>
            </p>
        </div>
    </div>
</div>
{{end}}
