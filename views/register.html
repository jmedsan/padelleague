{{define "content"}}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="card bg-base-100 shadow-xl w-full max-w-sm rounded-2xl">
        <div class="card-body">
            <div class="text-center mb-4">
                <span class="text-4xl">&#127934;</span>
                <h2 class="text-2xl font-bold mt-2">Crear cuenta</h2>
                <p class="text-sm opacity-50 mt-1">Unete a PadelLeague</p>
            </div>
            <div id="error"></div>
            <form hx-post="/register" hx-target="#error">
                <div class="form-control">
                    <label class="label" for="display_name">
                        <span class="label-text text-xs font-medium">Nombre</span>
                    </label>
                    <input type="text" id="display_name" name="display_name" class="input input-bordered w-full" placeholder="Tu nombre" required>
                </div>
                <div class="form-control mt-3">
                    <label class="label" for="email">
                        <span class="label-text text-xs font-medium">Email</span>
                    </label>
                    <input type="email" id="email" name="email" class="input input-bordered w-full" placeholder="tu@email.com" required>
                </div>
                <div class="form-control mt-3">
                    <label class="label" for="password">
                        <span class="label-text text-xs font-medium">Contrasena</span>
                    </label>
                    <input type="password" id="password" name="password" class="input input-bordered w-full" placeholder="********" required>
                </div>
                <div class="form-control mt-3">
                    <label class="label" for="password_confirm">
                        <span class="label-text text-xs font-medium">Confirmar contrasena</span>
                    </label>
                    <input type="password" id="password_confirm" name="password_confirm" class="input input-bordered w-full" placeholder="********" required>
                </div>
                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary w-full">Registrarse</button>
                </div>
            </form>
            <div class="divider text-xs opacity-40 my-3">O</div>
            <p class="text-center text-sm">
                Ya tienes cuenta? <a href="/login" class="link link-primary font-medium">Inicia sesion</a>
            </p>
        </div>
    </div>
</div>
{{end}}
