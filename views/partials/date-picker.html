{{define "datePicker"}}
<div class="relative date-picker-wrap inline-flex items-center gap-1">
    <input type="date" id="{{.ID}}" name="{{.Name}}" value="{{.Value}}"
           class="input input-bordered input-sm {{.ExtraClass}}" {{if .Required}}required{{end}}
           {{if .Min}}min="{{.Min}}"{{end}} {{if .Max}}max="{{.Max}}"{{end}}>
    <div class="dropdown dropdown-end date-calendar-dropdown hidden">
        <label tabindex="0" class="btn btn-ghost btn-sm btn-square min-h-[44px] min-w-[44px]" aria-label="Abrir calendario">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
        </label>
        <div tabindex="0" class="dropdown-content z-50 bg-base-100 shadow-xl rounded-box p-2">
            <calendar-date locale="es" first-day-of-week="1"><calendar-month></calendar-month></calendar-date>
        </div>
    </div>
</div>
{{end}}
