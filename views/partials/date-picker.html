{{define "datePicker"}}
<input type="text" id="{{.ID}}" name="{{.Name}}" value="{{.Value}}"
       class="input input-bordered input-sm {{.ExtraClass}}" data-datepicker {{if .Required}}required{{end}}
       placeholder="dd/mm/aaaa"
       {{if .Min}}data-min="{{.Min}}"{{end}} {{if .Max}}data-max="{{.Max}}"{{end}}>
{{end}}
