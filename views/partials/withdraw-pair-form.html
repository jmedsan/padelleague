{{/* The admin's withdraw action for one pair. The typed-word confirm (RETIRAR) is driven by
     data-confirm-type; the server does not check the word. Args: CompetitionID, PairID, PairName,
     Class (form), ButtonClass, Text (show the label beside the icon). */}}
{{define "withdrawPairForm"}}
<form hx-post="/admin/competitions/{{.CompetitionID}}/withdraw-pair" hx-confirm="¿Retirar a {{.PairName}}? Solo se marca la pareja como retirada: sus partidos no cambian y no se le asignarán partidos nuevos. Los partidos abiertos se cierran con el resultado del administrador o se liberan." data-confirm-type="RETIRAR" data-confirm-ok="Retirar" data-confirm-danger class="{{.Class}}">
    <input type="hidden" name="pair_id" value="{{.PairID}}">
    <button type="submit" hx-disabled-elt="this" class="{{.ButtonClass}}" aria-label="Retirar de la competición">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" /></svg>
        {{if .Text}}Retirar de la competición{{end}}
    </button>
</form>
{{end}}
