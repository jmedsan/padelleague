{{define "avatarIdentity"}}
{{if .CanEditAvatar}}
<div class="flex items-center gap-3">
    <label for="avatar-file-input" class="relative cursor-pointer group" title="Cambiar foto">
        {{template "avatarCircle" .}}
        <span class="absolute -bottom-1 -right-1 bg-primary text-primary-content rounded-full w-5 h-5 flex items-center justify-center text-xs">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="currentColor" class="w-3 h-3"><path d="M9 2a1 1 0 00-.894.553L7.382 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2h-3.382l-.724-1.447A1 1 0 0015 2H9zm3 15a5 5 0 110-10 5 5 0 010 10z"/></svg>
        </span>
    </label>
    <form id="avatar-upload-form" hx-post="/player/{{.ID}}/avatar" hx-target="#avatar-identity" hx-swap="innerHTML" hx-trigger="change from:#avatar-file-input" hx-encoding="multipart/form-data" class="hidden">
        <input type="file" id="avatar-file-input" name="avatar" accept="image/jpeg,image/png,image/webp">
    </form>
    {{template "playerIdentityText" .}}
</div>
{{else}}
{{template "playerCardIdentity" .}}
{{end}}
{{end}}
