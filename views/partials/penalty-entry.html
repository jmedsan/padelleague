{{define "penaltyEntry"}}
{{if .Penalty.Voided}}
<span class="badge badge-ghost badge-sm line-through opacity-60" title="Anulado por {{.Penalty.VoidedBy}}{{if .Penalty.VoidReason}} — {{.Penalty.VoidReason}}{{end}}">-{{.Penalty.Amount}}</span>
{{else}}
<span class="inline-flex items-center gap-1 badge badge-error badge-sm pr-0.5" title="{{.Penalty.Reason}}{{with .Penalty.AdminName}} · {{.}}{{end}}{{with .Penalty.Date}}, {{.}}{{end}}">-{{.Penalty.Amount}}<form hx-post="/admin/competitions/{{.CompetitionID}}/penalty" hx-confirm="¿Anular esta penalización?" data-confirm-danger data-confirm-ok="Anular" class="inline-flex">
        <input type="hidden" name="action" value="remove">
        <input type="hidden" name="penalty_id" value="{{.Penalty.ID}}">
        <button type="submit" hx-disabled-elt="this" class="btn btn-ghost btn-xs btn-circle min-h-0 h-5 w-5" aria-label="Anular penalización">
            <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
        </button>
    </form></span>
{{end}}
{{end}}
