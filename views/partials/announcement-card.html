{{define "announcementCard"}}
<div class="flex flex-col gap-1 p-3 bg-base-200/50 rounded-lg" data-testid="announcement-card">
    <div class="flex items-start justify-between gap-3">
        <p class="font-medium">{{.Record.GetString "title"}}</p>
        <span class="text-sm text-base-content/60 whitespace-nowrap" title="{{fmtDate (.Record.GetString "created")}}">{{relDate (.Record.GetString "created")}}</span>
    </div>
    <p class="text-sm opacity-80 whitespace-pre-wrap">{{.Record.GetString "body"}}</p>
    {{if .Mode.Admin}}
    <div class="flex justify-end mt-1">
        <form hx-post="/admin/competitions/{{.Record.GetString "competition"}}/announcements/{{.Record.Id}}/delete" hx-swap="none" hx-confirm="¿Eliminar este anuncio?" data-confirm-danger data-confirm-ok="Eliminar">
            <button type="submit" hx-disabled-elt="this" class="btn btn-ghost btn-sm gap-1 px-2 text-error" aria-label="Eliminar">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" /></svg>
                <span class="hidden [@media(hover:none)]:inline">Eliminar</span>
            </button>
        </form>
    </div>
    {{end}}
</div>
{{end}}
