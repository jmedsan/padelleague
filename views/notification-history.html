{{define "content"}}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold mb-6">Historial de notificaciones</h1>

    {{if .Notifications}}
    <div class="space-y-2">
        {{range .Notifications}}
        <div class="flex items-start gap-2 p-3 rounded-lg {{if not (.GetBool "read")}}bg-primary/5 font-medium{{end}}">
            <a hx-post="/notifications/{{.Id}}/read" hx-swap="none" class="flex-1 cursor-pointer hover:bg-base-200 rounded p-1">
                <p class="text-sm">{{.GetString "title"}}</p>
                {{with .GetString "body"}}
                <p class="text-xs text-base-content/60">{{.}}</p>
                {{end}}
                <p class="text-xs text-base-content/40 mt-1">{{.GetDateTime "created"}}</p>
            </a>
        </div>
        {{end}}
    </div>
    {{else}}
    <p class="text-sm text-base-content/50 text-center py-8">No tienes notificaciones</p>
    {{end}}

    <div class="mt-6">
        <a href="/profile/notifications" class="link text-sm">Preferencias de notificaciones</a>
    </div>
</div>
{{end}}
