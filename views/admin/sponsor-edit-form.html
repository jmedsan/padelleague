<h3 class="text-lg font-bold mb-4">Editar patrocinador</h3>
<form hx-post="/admin/sponsors/{{.Sponsor.Id}}" hx-target="body" enctype="multipart/form-data">
    <div class="form-control">
        <label class="label" for="edit-sponsor-name"><span class="label-text font-medium">Nombre</span></label>
        <input type="text" id="edit-sponsor-name" name="name" value="{{.Sponsor.GetString "name"}}" class="input input-bordered w-full" required>
    </div>
    <div class="form-control mt-3">
        <label class="label"><span class="label-text font-medium">Logo</span></label>
        <input type="file" name="logo" class="file-input file-input-bordered w-full" accept="image/*">
        <p class="text-sm opacity-50 mt-1">Deja vacío para conservar el logo actual.</p>
    </div>
    <div class="form-control mt-3">
        <label class="label" for="edit-sponsor-url"><span class="label-text font-medium">Enlace</span></label>
        <input type="url" id="edit-sponsor-url" name="url" value="{{.Sponsor.GetString "url"}}" class="input input-bordered w-full" placeholder="https://...">
    </div>
    <div class="form-control mt-3">
        <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" name="is_global" class="checkbox checkbox-sm" {{if .Sponsor.GetBool "is_global"}}checked{{end}}>
            <span class="label-text">Global (visible en todas las competiciones)</span>
        </label>
    </div>
    <div class="modal-action">
        <form method="dialog"><button class="btn btn-ghost">Cancelar</button></form>
        <button type="submit" hx-disabled-elt="this" class="btn btn-primary">Guardar</button>
    </div>
</form>
