{{define "content"}}
<div class="flex justify-between items-center mb-6">
    <div>
        <a href="/admin" class="text-sm text-base-content/60 hover:text-primary">&larr; Panel de administración</a>
        <h1 class="text-2xl font-bold">Jugadores</h1>
    </div>
</div>

<div class="overflow-x-auto">
    <table class="table">
        <thead>
            <tr>
                <th></th>
                <th>Nombre</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody>
            {{range .Players}}
            <tr>
                <td class="w-12">
                    <div class="avatar placeholder">
                        <div class="bg-neutral text-neutral-content w-8 rounded-full">
                            <span class="text-xs">{{slice (.GetString "display_name") 0 1}}</span>
                        </div>
                    </div>
                </td>
                <td class="font-medium">{{.GetString "display_name"}}</td>
                <td class="text-base-content/60">{{.GetString "email"}}</td>
            </tr>
            {{else}}
            <tr><td colspan="3" class="text-center text-base-content/60">No hay jugadores registrados</td></tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
