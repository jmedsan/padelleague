{{define "content"}}
<div class="flex justify-between items-center mb-6">
    <div>
        <a href="/admin" class="link link-hover text-sm opacity-60">&larr; Panel de administración</a>
        <h1 class="text-2xl font-bold mt-1">Parejas</h1>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('modal-create').showModal()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
        Nueva pareja
    </button>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {{range .Pairs}}
    <div class="card bg-base-100 shadow-sm border border-base-300">
        <div class="card-body p-5">
            <h2 class="card-title text-base">{{.Record.GetString "name"}}</h2>
            <div class="flex items-center gap-3 mt-1">
                <div class="flex items-center gap-2">
                    <div class="avatar placeholder">
                        <div class="bg-primary/10 text-primary w-8 rounded-full">
                            <span class="text-xs font-bold">{{slice .Player1 0 1}}</span>
                        </div>
                    </div>
                    <a href="{{entityURL "player" (.Record.GetString "player1")}}" class="text-sm link link-hover">{{.Player1}}</a>
                </div>
                <span class="text-base-content/40 text-xs font-bold">&amp;</span>
                <div class="flex items-center gap-2">
                    <div class="avatar placeholder">
                        <div class="bg-secondary/10 text-secondary w-8 rounded-full">
                            <span class="text-xs font-bold">{{slice .Player2 0 1}}</span>
                        </div>
                    </div>
                    <a href="{{entityURL "player" (.Record.GetString "player2")}}" class="text-sm link link-hover">{{.Player2}}</a>
                </div>
            </div>
            <div class="card-actions justify-end mt-3">
                <button class="btn btn-ghost btn-sm" onclick="openEditPair('{{.Record.Id}}', '{{.Record.GetString "name"}}', '{{.Record.GetString "player1"}}', '{{.Record.GetString "player2"}}')">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125" /></svg>
                    Editar
                </button>
            </div>
        </div>
    </div>
    {{else}}
    <div class="col-span-full">
        <div class="text-center py-12 opacity-60">
            <p class="text-lg">No hay parejas creadas</p>
            <p class="text-sm mt-1">Crea la primera pareja para empezar</p>
        </div>
    </div>
    {{end}}
</div>

<dialog id="modal-edit" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
        <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
        <h3 class="text-lg font-bold mb-4">Editar pareja</h3>
        <div id="edit-error" class="mb-2"></div>
        <form id="edit-form" method="post" hx-target="#edit-error">
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-medium">Nombre</span></label>
                <input type="text" name="name" id="edit-name" class="input input-bordered w-full" required>
            </div>
            <div class="form-control w-full mt-3">
                <label class="label"><span class="label-text font-medium">Jugador 1</span></label>
                <select name="player1" id="edit-player1" class="select select-bordered w-full" required>
                    <option value="">Seleccionar jugador</option>
                    {{range .Users}}
                    <option value="{{.Id}}">{{.GetString "display_name"}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-control w-full mt-3">
                <label class="label"><span class="label-text font-medium">Jugador 2</span></label>
                <select name="player2" id="edit-player2" class="select select-bordered w-full" required>
                    <option value="">Seleccionar jugador</option>
                    {{range .Users}}
                    <option value="{{.Id}}">{{.GetString "display_name"}}</option>
                    {{end}}
                </select>
            </div>
            <div class="modal-action">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>cerrar</button></form>
</dialog>

<dialog id="modal-create" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box">
        <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
        <h3 class="text-lg font-bold mb-4">Nueva pareja</h3>
        <div id="create-error" class="mb-2"></div>
        <form hx-post="/admin/pairs" hx-target="#create-error">
            <div class="form-control w-full">
                <label class="label"><span class="label-text font-medium">Nombre</span></label>
                <input type="text" name="name" class="input input-bordered w-full" placeholder="Ej: Los Invencibles" required>
            </div>
            <div class="form-control w-full mt-3">
                <label class="label"><span class="label-text font-medium">Jugador 1</span></label>
                <select name="player1" class="select select-bordered w-full" required>
                    <option value="">Seleccionar jugador</option>
                    {{range .Users}}
                    <option value="{{.Id}}">{{.GetString "display_name"}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-control w-full mt-3">
                <label class="label"><span class="label-text font-medium">Jugador 2</span></label>
                <select name="player2" class="select select-bordered w-full" required>
                    <option value="">Seleccionar jugador</option>
                    {{range .Users}}
                    <option value="{{.Id}}">{{.GetString "display_name"}}</option>
                    {{end}}
                </select>
            </div>
            <div class="modal-action">
                <button type="submit" class="btn btn-primary">Crear pareja</button>
            </div>
        </form>
    </div>
    <form method="dialog" class="modal-backdrop"><button>cerrar</button></form>
</dialog>

<script>
function openEditPair(id, name, p1, p2) {
    var form = document.getElementById('edit-form');
    form.setAttribute('hx-post', '/admin/pairs/' + id);
    htmx.process(form);
    document.getElementById('edit-name').value = name;
    document.getElementById('edit-player1').value = p1;
    document.getElementById('edit-player2').value = p2;
    document.getElementById('edit-error').innerHTML = '';
    document.getElementById('modal-edit').showModal();
}
</script>
{{end}}
