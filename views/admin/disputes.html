{{define "content"}}
<div class="mb-6">
    <a href="/admin/competitions" class="link link-hover text-sm opacity-60">← Competiciones</a>
    <h1 class="text-2xl font-bold mt-1">Disputas</h1>
</div>

{{if .Cards}}
<div class="space-y-4">
    {{range .Cards}}
    {{template "matchCard" .}}
    {{end}}
</div>
{{else}}
{{template "emptyState" "No hay disputas pendientes"}}
{{end}}
{{end}}
