{{define "content"}}
<div class="mb-6">
    <a href="/admin/competitions" class="link link-hover text-sm opacity-60">← Competiciones</a>
    <h1 class="text-2xl font-bold mt-1">Disputas</h1>
</div>

{{if .Items}}
<div class="space-y-2">
    {{range .Items}}
    {{template "healthItemRow" (dict "Item" . "ShowCategory" true)}}
    {{end}}
</div>
{{else}}
{{template "emptyState" "Sin disputas"}}
{{end}}
{{end}}
