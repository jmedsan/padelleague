{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Disputas pendientes</h1>

{{if .Cards}}
<div class="space-y-4">
    {{range .Cards}}
    {{template "matchCard" .}}
    {{end}}
</div>
{{else}}
<div class="card bg-base-100 shadow">
    <div class="card-body text-center py-12">
        <p class="text-lg opacity-60">No hay disputas pendientes</p>
    </div>
</div>
{{end}}
{{end}}
