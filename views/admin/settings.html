{{define "title"}}Configuración{{end}}
{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Configuración</h1>

{{if .DevMode}}
<div class="card bg-base-100 shadow-xl border border-error max-w-lg">
    <div class="card-body">
        <h2 class="card-title text-error">Zona de peligro</h2>
        <p class="text-sm opacity-70 mb-4">Selecciona qué datos eliminar. Los administradores y las pistas se conservan.</p>

        <div id="reset-form">
            <div class="form-control mb-4">
                <label class="label" for="confirm-input">
                    <span class="label-text">Escribe <kbd class="kbd kbd-sm">DELETE</kbd> para confirmar</span>
                </label>
                <input type="text" id="confirm-input" name="confirm" placeholder="DELETE" autocomplete="off"
                       class="input input-bordered input-error w-full" />
            </div>

            <div class="form-control mb-4">
                <label class="label"><span class="label-text">Datos a eliminar</span></label>
                <div class="flex flex-col gap-2">
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" name="players" id="chk-players" class="checkbox checkbox-sm checkbox-error" />
                        <span class="label-text">Jugadores (no admin)</span>
                    </label>
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" name="pairs" id="chk-pairs" class="checkbox checkbox-sm checkbox-error" disabled />
                        <span class="label-text">Parejas</span>
                    </label>
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" name="competitions" id="chk-competitions" class="checkbox checkbox-sm checkbox-error" disabled />
                        <span class="label-text">Competiciones y rondas</span>
                    </label>
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="checkbox" name="matches" id="chk-matches" class="checkbox checkbox-sm checkbox-error" disabled />
                        <span class="label-text">Partidos y mensajes</span>
                    </label>
                </div>
            </div>

            <div id="mode-section" class="form-control mb-4 hidden">
                <label class="label"><span class="label-text">Modo</span></label>
                <div class="flex flex-col gap-2">
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="radio" name="mode" value="" class="radio radio-sm" checked />
                        <span class="label-text">Solo borrar</span>
                    </label>
                    <label class="label cursor-pointer justify-start gap-3">
                        <input type="radio" name="mode" value="sample" class="radio radio-sm" />
                        <span class="label-text">Borrar y crear liga de ejemplo</span>
                    </label>
                </div>
            </div>

            <button id="reset-btn" type="button" disabled
                    class="btn btn-error w-full"
                    hx-post="/admin/settings/reset"
                    hx-target="#reset-result"
                    hx-include="#reset-form">
                Reiniciar base de datos
            </button>
        </div>

        <div id="reset-result" class="mt-4"></div>
    </div>
</div>

<script>
(function() {
    var inp = document.getElementById('confirm-input');
    var btn = document.getElementById('reset-btn');
    var chks = {
        players: document.getElementById('chk-players'),
        pairs: document.getElementById('chk-pairs'),
        competitions: document.getElementById('chk-competitions'),
        matches: document.getElementById('chk-matches'),
    };
    var modeSection = document.getElementById('mode-section');

    function updateState() {
        chks.pairs.disabled = !chks.players.checked;
        if (chks.pairs.disabled) chks.pairs.checked = false;

        chks.competitions.disabled = !chks.pairs.checked;
        if (chks.competitions.disabled) chks.competitions.checked = false;

        chks.matches.disabled = !chks.competitions.checked;
        if (chks.matches.disabled) chks.matches.checked = false;

        var allChecked = chks.players.checked && chks.pairs.checked &&
                chks.competitions.checked && chks.matches.checked;
        modeSection.classList.toggle('hidden', !allChecked);

        var anyChecked = chks.players.checked || chks.pairs.checked ||
                chks.competitions.checked || chks.matches.checked;
        btn.disabled = inp.value !== 'DELETE' || !anyChecked;
    }

    inp.addEventListener('input', updateState);
    Object.values(chks).forEach(function(c) { c.addEventListener('change', updateState); });
})();
</script>
{{else}}
<div class="alert alert-info max-w-lg">
    <span>No hay opciones de configuración disponibles en este entorno.</span>
</div>
{{end}}
{{end}}
