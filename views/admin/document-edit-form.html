<h3 class="text-lg font-bold mb-4">Editar documento</h3>
<form hx-post="/admin/documents/{{.Document.Id}}" hx-target="body" enctype="multipart/form-data">
    <div class="form-control">
        <label class="label" for="edit-doc-title"><span class="label-text font-medium">Título</span></label>
        <input type="text" id="edit-doc-title" name="title" value="{{.Document.GetString "title"}}" class="input input-bordered w-full" required>
    </div>
    <div class="form-control mt-3">
        <label class="label" for="edit-doc-description"><span class="label-text font-medium">Descripción</span></label>
        <textarea id="edit-doc-description" name="description" class="textarea textarea-bordered w-full" rows="2">{{.Document.GetString "description"}}</textarea>
    </div>
    <div class="form-control mt-3">
        <label class="label" for="edit-doc-url"><span class="label-text font-medium">Enlace</span></label>
        <input type="url" id="edit-doc-url" name="url" value="{{.Document.GetString "url"}}" class="input input-bordered w-full" placeholder="https://...">
    </div>
    <div class="form-control mt-3">
        <label class="label"><span class="label-text font-medium">Archivo</span></label>
        <input type="file" name="file" class="file-input file-input-bordered w-full">
        {{if .Document.GetString "file"}}<p class="text-sm opacity-50 mt-1">Archivo actual: {{.Document.GetString "file"}}</p>{{end}}
    </div>
    <div class="form-control mt-3">
        <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" name="is_default" class="checkbox checkbox-sm" {{if .Document.GetBool "is_default"}}checked{{end}}>
            <span class="label-text">Predeterminado (se adjunta a nuevas competiciones)</span>
        </label>
    </div>
    <div class="form-control">
        <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" name="is_mandatory" class="checkbox checkbox-sm" {{if .Document.GetBool "is_mandatory"}}checked{{end}}>
            <span class="label-text">Obligatorio (bloquea hasta que el jugador lo lea)</span>
        </label>
    </div>
    <div class="modal-action">
        <form method="dialog"><button class="btn btn-ghost">Cancelar</button></form>
        <button type="submit" hx-disabled-elt="this" class="btn btn-primary">Guardar</button>
    </div>
</form>
