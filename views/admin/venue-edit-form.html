<h3 class="text-lg font-bold mb-4">Editar club</h3>
<form hx-post="/admin/venues/{{.Venue.Id}}" hx-target="body">
    <div class="form-control">
        <label class="label" for="edit-venue-name"><span class="label-text font-medium">Nombre</span></label>
        <input type="text" id="edit-venue-name" name="name" value="{{.Venue.GetString "name"}}" class="input input-bordered w-full" required>
    </div>
    <div class="form-control mt-3">
        <label class="label" for="edit-venue-address"><span class="label-text font-medium">Dirección</span></label>
        <input type="text" id="edit-venue-address" name="address" value="{{.Venue.GetString "address"}}" class="input input-bordered w-full">
    </div>
    <div class="modal-action">
        <form method="dialog"><button class="btn btn-ghost">Cancelar</button></form>
        <button type="submit" hx-disabled-elt="this" class="btn btn-primary">Guardar</button>
    </div>
</form>
