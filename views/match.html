{{define "content"}}
<div class="max-w-2xl mx-auto">
    <div class="text-sm breadcrumbs mb-4 opacity-60">
        <ul>
            <li><a href="/">Inicio</a></li>
            <li><a href="/competition/{{.CompetitionID}}">{{.CompetitionName}}</a></li>
            <li>{{.RoundLabel}}</li>
        </ul>
    </div>

    {{template "matchCard" .Card}}

    {{if and (eq (.Card.Match.GetString "status") "final") .ShareText}}
    <div class="flex flex-wrap gap-2 mt-4">
        <button onclick="shareOrCopy('{{.ShareText}}', '{{.ShareURL}}')" class="btn btn-primary btn-sm gap-2 flex-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0-12.814a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186-9.566 5.314M16.783 17.093a2.25 2.25 0 1 0 0 2.186" />
            </svg>
            Compartir
        </button>
    </div>
    {{end}}

    <div class="mt-6" id="match-thread"
         hx-get="/match/{{.Card.Match.Id}}/thread"
         hx-trigger="load"
         hx-swap="innerHTML">
    </div>
</div>

<div id="share-toast" class="toast toast-center hidden z-50">
    <div class="alert alert-success">
        <span>Copiado!</span>
    </div>
</div>

<script>
function shareOrCopy(text, url) {
    var decoded = decodeURIComponent(text.replace(/\+/g, ' '));
    if (navigator.share) {
        navigator.share({ text: decoded, url: url }).catch(function() {});
        return;
    }
    navigator.clipboard.writeText(decoded).then(function() {
        var toast = document.getElementById('share-toast');
        if (toast) {
            toast.classList.remove('hidden');
            setTimeout(function() { toast.classList.add('hidden'); }, 2000);
        }
    });
}
</script>
{{end}}
